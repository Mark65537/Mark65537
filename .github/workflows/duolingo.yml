name: Duolingo README Update

on:
  schedule:
    - cron: "0 0 * * *" # каждый день в 00:00 UTC
  push:
    branches:
      - main
      - github-actions

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build Duolingo block
        shell: bash
        run: |
          set -e

          JSON=$(curl -s https://duojson.com/Marksics/profile.json)

          STREAK=$(echo "$JSON" | jq -r '.currentStreak // 0')

          OUT="duo.md"

          echo "<details open>" > $OUT
          echo "<summary><h2>🌍 Иностранные языки</h2></summary>" >> $OUT
          echo "" >> $OUT

          # ---- агрегируем XP по языку ----
          echo "$JSON" \
          | jq -r '
              .languages
              | group_by(.learningLanguage)
              | map({
                  lang: .[0].learningLanguage,
                  xp: (map(.xp) | add)
                })
              | sort_by(-.xp)
              | .[]
              | "\(.lang) \(.xp)"
          ' | while read LANG XP; do

              case "$LANG" in
                ja) FLAG="🇯🇵"; NAME="Japanese"; MAX=10000 ;;
                zh) FLAG="🇨🇳"; NAME="Chinese"; MAX=10000 ;;
                en) FLAG="🇺🇸"; NAME="English"; MAX=10000 ;;
                fr) FLAG="🇫🇷"; NAME="French"; MAX=5000 ;;
                de) FLAG="🇩🇪"; NAME="German"; MAX=5000 ;;
                ko) FLAG="🇰🇷"; NAME="Korean"; MAX=5000 ;;
                ru) FLAG="🇷🇺"; NAME="Russian"; MAX=2000 ;;
                id) FLAG="🇮🇩"; NAME="Indonesian"; MAX=2000 ;;
                *) FLAG="🌐"; NAME="$LANG"; MAX=3000 ;;
              esac

              # CEFR (очень грубая оценка)
              if [ "$XP" -lt 500 ]; then CEFR="A1"
              elif [ "$XP" -lt 1500 ]; then CEFR="A2"
              elif [ "$XP" -lt 4000 ]; then CEFR="B1"
              elif [ "$XP" -lt 8000 ]; then CEFR="B2"
              else CEFR="C1"
              fi

              # progress %
              PROG=$(awk "BEGIN {printf \"%.0f\", ($XP/$MAX)*100}")
              [ "$PROG" -gt 100 ] && PROG=100

              # bar 10 blocks
              FILLED=$((PROG / 10))
              EMPTY=$((10 - FILLED))

              BAR=$(printf "%0.s█" $(seq 1 $FILLED))
              BAR="${BAR}$(printf "%0.s░" $(seq 1 $EMPTY))"

              echo "- $FLAG **$NAME**" >> $OUT
              echo "  - XP: **$XP**" >> $OUT
              echo "  - CEFR: **$CEFR**" >> $OUT
              echo "  - Progress: $BAR ($PROG%)" >> $OUT
              echo "" >> $OUT

          done

          echo "🔥 Current streak: **$STREAK days**" >> $OUT
          echo "" >> $OUT
          echo "</details>" >> $OUT

      - name: Inject into README
        run: |
          awk '
            BEGIN {p=1}
            /<!-- DUOLINGO_START -->/ {
              print;
              system("cat duo_block.md");
              p=0;
              next;
            }
            /<!-- DUOLINGO_END -->/ {
              p=1;
            }
            p
          ' README.md > tmp.md

          mv tmp.md README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Update Duolingo stats"